name: amigo
description: The GoMigo app for local companions.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  supabase_flutter: 2.18.3
  uuid: ^4.5.1
  gomigo_design_system:
    path: ../../packages/design_system
  gomigo_shared_widgets:
    path: ../../packages/shared_widgets

dev_dependencies:
  flutter_lints: ^6.0.0
  http: ^1.6.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/figma/account/
    - assets/figma/booking/
    - assets/fonts/OFL.txt
  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
