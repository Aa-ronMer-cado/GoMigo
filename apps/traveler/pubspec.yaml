name: traveler
description: The GoMigo app for travelers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  flutter_map: ^8.3.2
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  supabase_flutter: 2.18.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  gomigo_design_system:
    path: ../../packages/design_system
  gomigo_shared_widgets:
    path: ../../packages/shared_widgets

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/fonts/OFL.txt
  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
